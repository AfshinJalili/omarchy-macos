[repository]
name = "omarchy-macos"
authors = ["Afshin Jalili"]
# Hyprland commit -> commit whose plugins/ build against it. Hyprland versions
# not listed build main. scripts/build-plugins.sh reads these too.
commit_pins = [
    ["11cbc6c577b84ffb1edf4df3fc5b6128c3ae6947", "6a1237aea09c46d2f4608784ce59d01de760b7cd"], # 0.57.2
    ["36b2e0cfe0c6094dbc47bd42a437431315bb3087", "ce347fc94af4c38bc38df693793eb82bbf17defe"], # 0.56.0
    ["5c9377c15f85c50648f35ca5a213754f95b93ca0", "ce347fc94af4c38bc38df693793eb82bbf17defe"], # 0.56.1
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "ce347fc94af4c38bc38df693793eb82bbf17defe"], # 0.56.2
]

[omarchy-macos-titlebars]
description = "macOS titlebars with traffic lights for Omarchy's floating workspaces"
authors = ["Vaxry", "Omarchy", "Afshin Jalili"]
output = "build/titlebars/omarchy-macos-titlebars.so"
build = [
    "cmake -S plugins/titlebars -B build/titlebars -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build/titlebars -j",
]

[omarchy-macos-mission-control]
description = "Mission Control: a macOS-style overview of windows and desktops"
authors = ["Vergil", "Afshin Jalili"]
output = "build/mission-control/omarchy-macos-mission-control.so"
build = [
    "cmake -S plugins/mission-control -B build/mission-control -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build/mission-control -j",
]
